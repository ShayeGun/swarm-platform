#       ip: "0.0.0.0"
#       port: 9091

# Disable "prometheus exporter" plugin which is being pulled in by the stream "syslog" plugin
# stream_plugins: []

plugins:
  - saml-auth
  - response-rewrite
  - serverless-pre-function
  - serverless-post-function
  - error-page
