x-common: &common
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

services:
  etcd:
    image: openeuler/etcd:3.6.9-oe2403sp3
    <<: *common
    volumes:
      - etcd_data:/default.etcd
    environment:
      ETCD_ENABLE_V2: "true"
      ALLOW_NONE_AUTHENTICATION: "yes"
      ETCD_ADVERTISE_CLIENT_URLS: "http://etcd:2379"
      ETCD_LISTEN_CLIENT_URLS: "http://0.0.0.0:2379"
    networks:
      - platform
    deploy:
      placement:
        constraints:
          - node.role == manager

  apisix:
    image: registry.example.com/tools/apisix-saml/apisix-3.17.0:latest
    <<: *common
    read_only: false
    configs:
      - source: apisix_conf
        target: /usr/local/apisix/conf/config.yaml
      - source: apisix_plug_saml
        target: /usr/local/apisix/apisix/plugins/saml-auth.lua
      - source: apisix_plug_err
        target: /usr/local/apisix/apisix/plugins/error-page.lua
      - source: apisix_docker_entrypoint
        target: /docker-entrypoint.sh
        mode: 0755
    ports:
      - published: 9180
        target: 9180
        protocol: tcp
        mode: host
      - published: 9080
        target: 9080
        protocol: tcp
        mode: host
    networks:
      platform:
        aliases:
          - apisix.${DOMAIN}
    deploy:
      placement:
        constraints:
          - node.role == manager
      labels:
        - "traefik.enable=true"
        - "traefik.swarm.network=platform"
        - "traefik.http.services.apisix.loadbalancer.server.port=9080"

        # service reference
        - "traefik.http.routers.apisix.service=apisix"

        # router TLS
        - "traefik.http.routers.apisix.tls=true"

        # router entrypoint
        - "traefik.http.routers.apisix.entrypoints=websecure"

        # router rule
        - "traefik.http.routers.apisix.rule=Host(`example.com`)"

networks:
  platform:
    external: true

volumes:
  etcd_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH:-/data}/etcd

configs:
  apisix_conf:
    file: ./apisix_conf/config.yml
  apisix_plug_saml:
    file: ./apisix_conf/plugins/saml-auth.lua
  apisix_plug_err:
    file: ./apisix_conf/plugins/error-page.lua
  apisix_docker_entrypoint:
    file: ./apisix_conf/docker-entrypoint.sh
