http:
  middlewares:
    redirect-to-https:
      redirectScheme:
        scheme: https
    rate-limiter:
      rateLimit:
        average: 20
        period: 1s
        burst: 40

  routers:
    http-redirect-to-https:
      entryPoints:
        - web
      rule: 'Host(`login.{{env "DOMAIN"}}`) || Host(`panel.{{env "DOMAIN"}}`) || Host(`skm.{{env "DOMAIN"}}`) || Host(`{{env "DOMAIN"}}`) || Host(`example.com`)'
      service: noop@internal
      middlewares:
        - redirect-to-https

tls:
  certificates:
    - certFile: /letsencrypt/certificate.pem
      keyFile: /letsencrypt/key.pem
    - certFile: /letsencrypt/exp-certificate.pem
      keyFile: /letsencrypt/exp-key.pem
  options:
    default:
      minVersion: VersionTLS12
      cipherSuites:
        - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_RSA_WITH_AES_256_CBC_SHA
        - TLS_RSA_WITH_AES_256_GCM_SHA384
        - TLS_RSA_WITH_AES_256_CBC_SHA

      curvePreferences:
        - secp521r1
        - secp384r1
        - x25519
        - secp256r1
      sniStrict: true
