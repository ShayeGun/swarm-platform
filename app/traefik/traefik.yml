global:
  checkNewVersion: true

log:
  level: WARN

api:
  dashboard: false
  insecure: false

ping: {}

accessLog: {}

metrics:
  prometheus: {}

entryPoints:
  web:
    address: ":80"
  websecure:
    address: ":443"

providers:
  swarm:
    endpoint: "unix:///var/run/docker.sock"
    watch: true
    exposedByDefault: false
  file:
    filename: /etc/traefik/dynamic.yml
    watch: true
