version: "3.8"

x-common: &common
  env_file:
    - ../.env
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"
  networks:
    - platform

x-deploy: &deploy-common
  replicas: 1
  restart_policy:
    condition: any
    delay: 5s

x-secure: &secure
  <<: *common
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  traefik:
    <<: *common
    image: ${TRAEFIK_IMAGE:-traefik:v3.6.2}
    environment:
      - DOMAIN=${DOMAIN}
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: tcp
        mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - ${DATA_PATH:-/data}/traefik:/letsencrypt
    deploy:
      <<: *deploy-common
      placement:
        constraints:
          - node.role == manager

  postgres:
    <<: *common
    image: ${POSTGRES_IMAGE:-postgres:17.6-alpine}
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ${POSTGRES_DATA_PATH:-/data/postgres}:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      <<: *deploy-common
      placement:
        constraints:
          - node.labels.server == manager
      resources:
        limits:
          memory: 2G

  redis:
    <<: *common
    image: ${REDIS_IMAGE:-redis:8.0.2-alpine}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - ${REDIS_DATA_PATH:-/data/redis}:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      <<: *deploy-common
      placement:
        constraints:
          - node.labels.server == manager

  keycloak:
    <<: *secure
    image: ${KEYCLOAK_IMAGE:-rsa-kc:26.7.3}
    command: start
    environment:
      KC_HOSTNAME: "https://kc.${DOMAIN}"
      KC_HTTP_ENABLED: "true"
      KC_HTTPS_PORT: "8443"
      KC_HTTPS_CERTIFICATE_FILE: /opt/keycloak/conf/certs/server.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /opt/keycloak/conf/certs/server.key
      KC_HTTPS_CLIENT_AUTH: request
      KC_HTTPS_TRUST_STORE_FILE: /opt/keycloak/conf/certs/ca.crt
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: "jdbc:postgresql://postgres:5432/${KEYCLOAK_DB:-keycloak}"
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-change-me}
      KC_LOG: "console"
    volumes:
      - ${CERTS_PATH:-/data/keycloak/certs}:/opt/keycloak/conf/certs:ro
    deploy:
      <<: *deploy-common
      placement:
        constraints:
          - node.labels.server == keycloak
      labels:
        - "traefik.enable=true"
        - "traefik.swarm.network=platform"
        - "traefik.tcp.services.keycloak.loadbalancer.server.port=8443"
        - "traefik.tcp.routers.keycloak.service=keycloak"
        - "traefik.tcp.routers.keycloak.tls.passthrough=true"
        - "traefik.tcp.routers.keycloak.entrypoints=websecure"
        - "traefik.tcp.routers.keycloak.rule=HostSNI(`kc.${DOMAIN}`)"
      resources:
        limits:
          memory: 2G

networks:
  platform:
    external: true
