multitenancy_enabled: false
no_auth_tenant: anonymous

server:
  http_listen_port: 9009
  log_level: info

common:
  storage:
    backend: filesystem
    filesystem:
      dir: /data

blocks_storage:
  backend: filesystem
  filesystem:
    dir: /data/blocks

compactor:
  data_dir: /data/compactor

ingester:
  ring:
    replication_factor: 1

limits:
  max_global_series_per_user: 1000000
  max_label_names_per_series: 50

distributor:
  ring:
    kvstore:
      store: inmemory

store_gateway:
  sharding_ring:
    kvstore:
      store: inmemory
